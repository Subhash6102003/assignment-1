version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: launchpulse-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - ./backend/launchpulse.db:/app/launchpulse.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: launchpulse-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
